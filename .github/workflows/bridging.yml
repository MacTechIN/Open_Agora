name: 브리징 배치

# 하루 한 번 브리징 점수를 다시 계산한다. → docs/03_ALGORITHMS_AI.md §1.4
#
# KST 04:00 = UTC 19:00 (전날). 사람이 적게 쓰는 시간에 돌린다.
#
# 켜려면 둘이 필요하다.
#   · Vercel 환경변수  BRIDGING_SECRET
#   · 저장소 시크릿    BRIDGING_SECRET  (같은 값)
# 없으면 조용히 건너뛴다 — 설정 전에 빨간 X 를 남길 이유가 없다.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: bridging
  cancel-in-progress: false

jobs:
  bridging:
    name: 브리징 점수 재계산
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성
        run: python3 -m pip install --quiet -r services/bridging/requirements.txt

      # 점수를 새로 내기 전에 성질이 유지되는지 먼저 본다. 깨진 모델이 낸
      # 점수를 랭킹에 쓰면 그 사이 순위가 인기투표가 된다.
      - name: 몰표 무력화·군집 확인 (VS-F2·F4)
        run: python3 -m pytest services/bridging/ -q

      - name: 배치
        working-directory: services/bridging
        env:
          BRIDGING_SECRET: ${{ secrets.BRIDGING_SECRET }}
          CIVICAGORA_BASE: ${{ vars.CIVICAGORA_BASE_URL || 'https://open-agora.vercel.app' }}
        run: python3 batch.py

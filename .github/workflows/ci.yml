name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_CS_TAG: v0.9.2+v0.28.3

jobs:
  core:
    name: 코어 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 포맷 검사
        run: cargo fmt --all -- --check
      - name: 린트
        run: cargo clippy --all-targets -- -D warnings
      - name: 테스트
        run: cargo test --all

  parity:
    name: G-PARITY 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 바인드젠은 uniffi 버전과 짝이 맞아야 한다. 태그를 고정한다.
      - name: C# 바인드젠 캐시
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}
      - name: C# 바인드젠 설치
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag "$UNIFFI_BINDGEN_CS_TAG"

      - name: Kotlin·C# 바인딩 계약 일치 확인
        run: ./scripts/check-binding-parity.sh

  moderation:
    name: 톤 코칭 판단 계층 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -e 'services/moderation[dev]'
      - name: 테스트
        # 정책은 순수 함수라 API 자격증명 없이 전부 검증된다.
        run: pytest services/moderation/tests -q

  cross-compile:
    name: 크로스 컴파일 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android arm64
            os: ubuntu-latest
            target: aarch64-linux-android
          - name: Android x86_64
            os: ubuntu-latest
            target: x86_64-linux-android
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo-ndk 설치
        if: startsWith(matrix.target, 'aarch64-linux-android') || startsWith(matrix.target, 'x86_64-linux-android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: 빌드 (Android)
        if: runner.os == 'Linux'
        run: cargo ndk -t ${{ matrix.target }} build --release -p civicagora-core

      - name: 빌드 (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p civicagora-core

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_CS_TAG: v0.9.2+v0.28.3

jobs:
  core:
    name: 코어 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 포맷 검사
        run: cargo fmt --all -- --check
      - name: 린트
        run: cargo clippy --all-targets -- -D warnings
      - name: 테스트
        run: cargo test --all

  parity:
    name: G-PARITY 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 바인드젠은 uniffi 버전과 짝이 맞아야 한다. 태그를 고정한다.
      - name: C# 바인드젠 캐시
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}
      - name: C# 바인드젠 설치
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag "$UNIFFI_BINDGEN_CS_TAG"

      - name: Kotlin·C# 바인딩 계약 일치 확인
        run: ./scripts/check-binding-parity.sh

  web:
    name: 웹 빌드·계약 대조
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        working-directory: web
        run: npm ci
      - name: 타입 검사
        working-directory: web
        run: npx tsc --noEmit
      # 검증 규칙이 Rust 코어와 갈리지 않았는지 확인한다.
      # 한쪽만 고치면 앱에서 통과한 글이 서버에서 거부된다.
      # 복사본이 contracts/ 원본과 같은지도 함께 본다.
      - name: 계약 대조
        working-directory: web
        run: npm run check:contracts
      # 중첩 컴포넌트는 입력창을 매 글자마다 교체해 한글 조합을 깨뜨린다.
      # 영문 입력은 멀쩡해 보여 눈으로 찾기 어렵다.
      - name: 중첩 컴포넌트 검사
        working-directory: web
        run: npm run check:components
      - name: 빌드
        working-directory: web
        run: npx next build

  immutability:
    name: G-IMMUT 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 삭제 경로 부재 확인
        run: ./scripts/check-immutability.sh

  moderation:
    name: 톤 코칭 판단 계층 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -e 'services/moderation[dev]'
      - name: 테스트
        # 정책은 순수 함수라 API 자격증명 없이 전부 검증된다.
        run: pytest services/moderation/tests -q

  cross-compile:
    name: 크로스 컴파일 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android arm64
            os: ubuntu-latest
            target: aarch64-linux-android
          - name: Android x86_64
            os: ubuntu-latest
            target: x86_64-linux-android
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 바이너리 배포 다운로드가 504로 깨진 적이 있어 소스 설치로 고정한다.
      - name: cargo-ndk 캐시
        id: cache-ndk
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4
      - name: cargo-ndk 설치
        if: runner.os == 'Linux' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: 빌드 (Android)
        if: runner.os == 'Linux'
        run: cargo ndk -t ${{ matrix.target }} build --release -p civicagora-core

      - name: 빌드 (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p civicagora-core

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  UNIFFI_BINDGEN_CS_TAG: v0.9.2+v0.28.3

jobs:
  core:
    name: 코어 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 포맷 검사
        run: cargo fmt --all -- --check
      - name: 린트
        run: cargo clippy --all-targets -- -D warnings
      - name: 테스트
        run: cargo test --all

  parity:
    name: G-PARITY 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 바인드젠은 uniffi 버전과 짝이 맞아야 한다. 태그를 고정한다.
      - name: C# 바인드젠 캐시
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}
      - name: C# 바인드젠 설치
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          cargo install uniffi-bindgen-cs \
            --git https://github.com/NordSecurity/uniffi-bindgen-cs \
            --tag "$UNIFFI_BINDGEN_CS_TAG"

      - name: Kotlin·C# 바인딩 계약 일치 확인
        run: ./scripts/check-binding-parity.sh

  web:
    name: 웹 빌드·계약 대조
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        working-directory: web
        run: npm ci
      - name: 타입 검사
        working-directory: web
        run: npx tsc --noEmit
      # 검증 규칙이 Rust 코어와 갈리지 않았는지 확인한다.
      # 한쪽만 고치면 앱에서 통과한 글이 서버에서 거부된다.
      # 복사본이 contracts/ 원본과 같은지도 함께 본다.
      - name: 계약 대조
        working-directory: web
        run: npm run check:contracts
      # 중첩 컴포넌트는 입력창을 매 글자마다 교체해 한글 조합을 깨뜨린다.
      # 영문 입력은 멀쩡해 보여 눈으로 찾기 어렵다.
      - name: 중첩 컴포넌트 검사
        working-directory: web
        run: npm run check:components
      # 서명 대상 바이트와 식별자 규칙은 코어와 서버 두 곳에 구현되어 있다.
      # 한쪽만 고치면 앱이 올린 글이 서버에서 전부 검증 실패하는데, 그 원인은
      # 서명이 아니라 바이트 한 칸이라 로그만 봐서는 찾기 어렵다.
      - name: 서명 형식 대조
        working-directory: web
        run: npm run check:signing
      # 머클 트리도 코어와 서버 두 곳에 있다. 한쪽만 고치면 서버가 만든
      # 증명이 앱에서 통과하지 않고, 원인이 접두사 한 바이트인 경우가 많다.
      - name: 머클 형식 대조
        working-directory: web
        run: npm run check:anchor
      # 영지식 아티팩트는 증명의 뿌리다. 바뀐 아티팩트로 만든 증명은 검증이
      # 통과해도 그것이 무엇을 뜻하는지 우리가 알 수 없다.
      - name: 영지식 아티팩트 대조
        run: python3 scripts/check-artifacts.py
      # VS-F2. 이 테스트가 실패하면 이 플랫폼은 그냥 또 하나의 인기투표
      # 사이트다. 랭킹·반응·평판을 건드리는 모든 변경이 여기를 지나야 한다.
      - name: 브리징·지형도 회귀 테스트 (VS-F2·F4)
        run: |
          python3 -m pip install --quiet -r services/bridging/requirements.txt
          python3 -m pytest services/bridging/ -q
      # 허용 도메인의 DKIM 키가 폐기되거나 짧아지면 가입의 신뢰 뿌리가 무너진다.
      # DNS 를 보므로 일시적 실패가 있을 수 있어 경고로 둔다.
      - name: DKIM 허용 목록 감시
        continue-on-error: true
        run: python3 scripts/dkim-watch.py
      # 새 쓰기 경로에 회원 확인을 빠뜨리면 아무나 글을 쓸 수 있게 되는데,
      # 겉보기에는 정상 동작하므로 알아채기 어렵다.
      - name: 글쓰기 회원 확인 검사
        working-directory: web
        run: npm run check:writegate
      # 클라이언트 컴포넌트가 DB 모듈을 끌어오면 브라우저 번들에 Node 전용
      # 패키지가 딸려와 빌드가 깨진다. 상수 하나 때문에 생기므로 알아채기 어렵다.
      - name: 클라이언트 import 검사
        working-directory: web
        run: npm run check:imports
      # 반응자 목록은 존재해서는 안 된다(G-PRIV, INV-3). 집계는 공개하고
      # 개인은 감추는 구조라 한 줄만 더해도 그대로 목록이 된다.
      - name: 반응자 목록 검사
        working-directory: web
        run: npm run check:privacy
      # 톤 스크리닝은 코어와 웹 두 곳에 있다. 한쪽만 고치면 같은 문장이
      # 기기마다 다르게 판정되고, 그 차이는 사용자가 물어볼 때에야 드러난다.
      - name: 스크리닝 대조
        working-directory: web
        run: npm run check:screening
      # 작성 중인 글이 기기 밖으로 나가면 톤 스크리닝을 기기 안에 둔 이유가
      # 사라진다. 자동 저장·분석 도구가 무심코 들어오는 것을 막는다.
      - name: 초안 유출 검사
        working-directory: web
        run: npm run check:draft
      - name: 빌드
        working-directory: web
        run: npx next build

  immutability:
    name: G-IMMUT 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 삭제 경로 부재 확인
        run: ./scripts/check-immutability.sh

  moderation:
    name: 톤 코칭 판단 계층 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: pip install -e 'services/moderation[dev]'
      - name: 테스트
        # 정책은 순수 함수라 API 자격증명 없이 전부 검증된다.
        run: pytest services/moderation/tests -q

  cross-compile:
    name: 크로스 컴파일 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android arm64
            os: ubuntu-latest
            target: aarch64-linux-android
          - name: Android x86_64
            os: ubuntu-latest
            target: x86_64-linux-android
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 바이너리 배포 다운로드가 504로 깨진 적이 있어 소스 설치로 고정한다.
      - name: cargo-ndk 캐시
        id: cache-ndk
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4
      - name: cargo-ndk 설치
        if: runner.os == 'Linux' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: 빌드 (Android)
        if: runner.os == 'Linux'
        run: cargo ndk -t ${{ matrix.target }} build --release -p civicagora-core

      - name: 빌드 (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p civicagora-core

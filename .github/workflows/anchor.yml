name: 앵커링

# 6시간마다 그때까지 올라온 글을 머클 트리로 묶어 루트 하나를
# OpenTimestamps(비트코인)에 남긴다. → docs/16_ONCHAIN_PLAN.md 2단계
#
# Vercel Cron 을 쓰지 않는 이유는 무료 요금제의 실행 빈도가 하루 한 번으로
# 묶여 있어서다. GitHub Actions 는 이 저장소에서 이미 쓰고 있고 추가 비용이
# 없다.
#
# 켜려면 둘이 필요하다.
#   · Vercel 환경변수  ANCHOR_SECRET  (32자 이상 임의 문자열)
#   · 저장소 시크릿    ANCHOR_SECRET  (같은 값)
# 없으면 이 잡은 조용히 건너뛴다 — 설정 전에 빨간 X 를 남길 이유가 없다.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: anchor
  cancel-in-progress: false

jobs:
  anchor:
    name: 머클 루트 앵커링
    runs-on: ubuntu-latest
    steps:
      - name: 배치 만들기
        env:
          SECRET: ${{ secrets.ANCHOR_SECRET }}
          BASE: ${{ vars.CIVICAGORA_BASE_URL || 'https://open-agora.vercel.app' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "ANCHOR_SECRET 이 없어 건너뜁니다."
            echo "설정하는 법은 docs/16_ONCHAIN_PLAN.md 2단계를 보십시오."
            exit 0
          fi

          # 응답 본문과 상태 코드를 함께 받는다. 상태만 보면 "새 글이 없음"과
          # "실패"를 구분할 수 없다.
          body=$(mktemp)
          code=$(curl -s -o "$body" -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer $SECRET" \
                   --max-time 120 "$BASE/api/anchor/build")
          echo "HTTP $code"
          cat "$body"
          echo

          case "$code" in
            201) echo "새 배치를 만들었습니다." ;;
            200) echo "앵커에 넣을 새 글이 없습니다." ;;
            *)   echo "앵커링에 실패했습니다."; exit 1 ;;
          esac
